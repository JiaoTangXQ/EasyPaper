# Add explicitly after docker-compose.prod.yml. The API key stays in the private
# backend home volume; this file does not contain it.
services:
  backend:
    environment:
      EASYPAPER_AI_PROVIDER: cursor
      EASYPAPER_CURSOR_EXECUTABLE: /opt/cursor-j/bin/cursor-j
      EASYPAPER_CURSOR_MODEL: "grok-4.7-high-fast"
      EASYPAPER_CURSOR_MAX_CONCURRENT: "1"
      EASYPAPER_CURSOR_TIMEOUT_SECONDS: "180"
      EASYPAPER_DOWNLOAD_PROXY: ${EASYPAPER_DOWNLOAD_PROXY:-}
      CURSOR_J_KEY_FILE: /home/app/.config/cursor-j/api-key
      CURSOR_CONFIG_DIR: /home/app/.config/cursor-j
      CURSOR_DATA_DIR: /home/app/.local/share/cursor-j/data
      NODE_COMPILE_CACHE: /home/app/.cache/cursor-j-compile
    volumes:
      - type: bind
        source: ${CURSOR_J_RUNTIME_DIR:-/opt/cursor-j}
        target: /opt/cursor-j
        read_only: true
        bind:
          create_host_path: false
