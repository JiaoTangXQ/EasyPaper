llm:
  # api: OpenAI-compatible HTTP service; codex: local Codex CLI / ChatGPT login.
  # EASYPAPER_AI_PROVIDER overrides this value. Restart the backend after switching.
  provider: "api"
  api_key: "YOUR_API_KEY"
  base_url: "https://openrouter.ai/api/v1"
  model: "gemini-2.5-flash"
  judge_model: "gemini-2.5-flash"
  codex:
    executable: "codex" # Or the absolute path returned by `command -v codex`.
    model: "" # Empty uses the installed CLI default, independent of llm.model.
    reasoning_effort: "low"
    timeout_seconds: 180
    max_concurrent: 2
processing:
  max_pages: 100
  max_upload_mb: 50
  max_concurrent: 3
  preview_html: true
security:
  secret_key: "CHANGE_THIS_TO_A_SECURE_SECRET_KEY"
  cors_origins:
    - "http://localhost:5173"
    - "http://127.0.0.1:5173"
  # Public deployments: set to false and create accounts with
  #   python -m app.cli create-user <email> <password>
  allow_registration: true
agent:
  api_keys:
    - "CHANGE_ME"
  draft_ttl_minutes: 30
  mcp_mount_path: "/mcp"
storage:
  cleanup_minutes: 30
  temp_dir: "./backend/tmp"
  # Permanent PDF revisions. Keep this directory and the database in backups.
  # Empty uses <temp_dir>/reader-library; it is excluded from task cleanup.
  library_dir: ""
database:
  url: "sqlite:///./backend/data/app.db"
logging:
  level: "INFO"
  file: "./backend/logs/app.log"
