server {
    listen 8080;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;

    # Vite fingerprints every file in /assets (content hash in the name), so a
    # browser can keep them forever. Without this, the 2.3 MB PDF engine and the
    # 8 MB CJK fallback font were downloaded again on every reader visit.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback. index.html must be revalidated so a new deploy is picked up.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 129M;
    }

    location /health {
        proxy_pass http://backend:8000;
    }
}
