name: easypaper

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

services:
  db:
    image: ${POSTGRES_IMAGE:-postgres:16-alpine}
    restart: unless-stopped
    environment:
      POSTGRES_USER: easypaper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?run scripts/prepare_server.py}
      POSTGRES_DB: easypaper
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks: [database]
    mem_limit: ${DATABASE_MEMORY:-512m}
    command: [postgres, -c, shared_buffers=64MB, -c, max_connections=40]
    pids_limit: 128
    security_opt: [no-new-privileges:true]
    logging: *logging
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U easypaper -d easypaper"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: ${BACKEND_IMAGE:-easypaper-backend:local}
    build: ./backend
    restart: unless-stopped
    init: true
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_CONFIG_PATH: /app/config/config.yaml
      APP_ENV: production
      EASYPAPER_SECRET_KEY: ${EASYPAPER_SECRET_KEY:?run scripts/prepare_server.py}
      DATABASE_URL: postgresql://easypaper:${POSTGRES_PASSWORD}@db:5432/easypaper
      # Accounts and saved papers remain accessible before AI is configured.
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_MODEL: ${LLM_MODEL:-}
      EASYPAPER_READER_LIBRARY_DIR: /app/reader-library
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
    volumes:
      - ./deploy/config.production.yaml:/app/config/config.yaml:ro
      - backend-tmp:/app/tmp
      - backend-library:/app/reader-library
      - backend-logs:/app/logs
      - backend-cache:/home/app
    networks: [database, app]
    read_only: true
    tmpfs:
      - /tmp:size=${BACKEND_TMPFS_SIZE:-512m},mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: ${BACKEND_MEMORY:-4g}
    cpus: ${BACKEND_CPUS:-2}
    pids_limit: 256
    stop_grace_period: 60s
    logging: *logging
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  frontend:
    image: ${FRONTEND_IMAGE:-easypaper-frontend:local}
    build: ./frontend
    restart: unless-stopped
    networks: [app]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    pids_limit: 64
    logging: *logging

  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    depends_on: [frontend, backend]
    ports:
      - "${BIND_IP:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${BIND_IP:-0.0.0.0}:${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${CADDY_SITE_ADDRESS:-${DOMAIN:?run scripts/prepare_server.py}}
      CADDY_TRUSTED_PROXIES: ${CADDY_TRUSTED_PROXIES:-127.0.0.1/32}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [app]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    mem_limit: 192m
    pids_limit: 64
    logging: *logging

networks:
  database:
    internal: true
  app:

volumes:
  pg-data:
  backend-tmp:
  backend-library:
  backend-logs:
  backend-cache:
  caddy-data:
  caddy-config:
